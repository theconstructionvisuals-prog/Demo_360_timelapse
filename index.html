<!DOCTYPE html>

<html lang="fi">
<head>
<meta charset="utf-8">
<title>360 Timeline Viewer</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #000;
  font-family: sans-serif;
}

#pano {
  position: fixed;
  width: 100vw;
  height: 100vh;
}

/* 🔥 gradient */
#bottomFade {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 160px;
  background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
  pointer-events: none;
  z-index: 5;
}

/* 🔥 SIDEBAR */
#sidebar {
  position: fixed;
  top: 20px;
  left: 8px;
  z-index: 20;
}

/* OTSIKKO */
.sidebar-title {
  font-size: 14px;
  letter-spacing: 0.14em;
  margin-bottom: 12px;
  color: white;

  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  position: relative;
}

/* viiva */
.sidebar-title::after {
  content: "";
  display: block;
  width: 22px;
  height: 1px;
  margin-top: 8px;
  background: rgba(255,255,255,0.25);
}

/* LISTA */
#sidebarList {
  display: flex;
  flex-direction: column;
  gap: 6px; /* 🔥 pienempi gap */

  padding: 6px 8px;
  border-radius: 6px;

  width: fit-content;

  background: rgba(0, 0, 0, 0.10);
  backdrop-filter: blur(4px);
}

/* ITEMIT */
#sidebarList .item {
  font-size: 12px;
  padding-left: 2px; /* 🔥 lähemmäs reunaa */
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  transition: all 0.2s ease;
}

#sidebarList .item:hover {
  color: rgba(255,255,255,0.8);
}

#sidebarList .item.active {
  color: white;
}

/* TIMELINE */
#timeline {
  position: fixed;
  bottom: 40px;
  left: 0;
  width: 100%;

  display: flex;
  gap: 40px;
  overflow-x: auto;

  cursor: grab;
  z-index: 10;
}

#timeline::-webkit-scrollbar {
  display: none;
}

/* ITEM */
.item {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;

  padding-top: 8px;
  color: rgba(255,255,255,0.4);
  cursor: pointer;
}

.item.active {
  color: white;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
  margin-bottom: 6px;

  transform-origin: center;
  transition: all 0.2s ease;
}

.item.active .dot {
  background: white;
  transform: scale(1.4) translateY(2px);
}

.label {
  font-size: 12px;
}

/* MOBILE */
@media (max-width: 768px) {

  #sidebar {
    display: none;
  }

  #timeline {
    bottom: 20px;
    gap: 28px;
  }

  .dot {
    width: 16px;
    height: 16px;
  }

  .label {
    font-size: 14px;
  }

  #bottomFade {
    height: 140px;
  }
}
</style>

</head>

<body>

<div id="pano"></div>
<div id="bottomFade"></div>

<!-- SIDEBAR -->

<div id="sidebar">
  <div class="sidebar-title">Construction Site Alpha</div>
  <div id="sidebarList"></div>
</div>

<div id="timeline"></div>

<script src="https://unpkg.com/marzipano/dist/marzipano.js"></script>

<script src="app.js"></script>

</body>
</html>
