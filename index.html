<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360 Timeline Viewer</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #000;
  font-family: sans-serif;
}

#pano {
  position: fixed;
  width: 100vw;
  height: 100vh;
}

/* PLAY BUTTON */
#playBtn {
  position: fixed;
  right: 20px;
  bottom: 100px;
  z-index: 15;

  width: 48px;
  height: 48px;
  border-radius: 50%;

  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(6px);

  color: white;
  font-size: 18px;

  border: none;
  cursor: pointer;
}

/* TIMELINE */
#timeline {
  position: fixed;
  bottom: 40px;
  width: 100%;
  display: flex;
  gap: 40px;
  overflow-x: auto;
  z-index: 10;
}

.item {
  flex: 0 0 auto;
  text-align: center;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
}

.item.active {
  color: white;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
  margin: 0 auto 6px;
}

.item.active .dot {
  background: white;
  transform: scale(1.4);
}

.label {
  font-size: 12px;
}
</style>

</head>

<body>

<div id="pano"></div>
<div id="timeline"></div>
<button id="playBtn">▶</button>

<script src="https://unpkg.com/marzipano/dist/marzipano.js"></script>
<script src="app.js"></script>

</body>
</html>
